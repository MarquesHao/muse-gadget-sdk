dependencies:
  idf:
    version: ">=5.5"
  espressif/cjson: "~1.7"
  # The frame-library face (muse_frames.c) decodes the action
  # library's JPEG frames with this; esp_lv_decoder already pulls it
  # into the project for the boards that have a display. (libpng went
  # with the runtime sprite kits in the smooth round: the ex-kit
  # faces are baked JPEG stills now.)
  espressif/esp_new_jpeg:
    version: "1.*"
    rules:
      - if: "$CONFIG{MUSE_BOARD_ID} != \"none\""
  # Video over Wi-Fi announces itself with it (muse_video_wifi.c).
  espressif/mdns:
    version: "^1.8"
    rules:
      - if: "$CONFIG{MUSE_VIDEO_MDNS} == \"y\""
  lvgl/lvgl:
    version: "9.5.0"
    public: true
    rules:
      - if: "$CONFIG{MUSE_BOARD_ID} != \"none\""
  espressif/esp_codec_dev:
    version: "~1.5"
    public: true
    rules:
      - if: "$CONFIG{MUSE_BOARD_ID} != \"none\""
  espressif/esp_lvgl_adapter:
    version: "0.6.4"
    rules:
      - if: "$CONFIG{MUSE_BOARD_ID} in [\"waveshare_s3_175c\", \"waveshare_s3_216\", \"aipi\", \"sensecap_watcher\"]"
  waveshare/esp32_s3_touch_amoled_1_75c:
    version: "^3.0.0"
    rules:
      - if: "$CONFIG{MUSE_BOARD_ID} == \"waveshare_s3_175c\""
  waveshare/esp32_s3_touch_amoled_2_16:
    version: "^2.0.1"
    rules:
      - if: "$CONFIG{MUSE_BOARD_ID} == \"waveshare_s3_216\""
  espressif/esp_lcd_spd2010:
    version: "^2.0.0"
    rules:
      - if: "$CONFIG{MUSE_BOARD_ID} == \"sensecap_watcher\""
  espressif/esp_lcd_touch_spd2010:
    version: "^2.0.1"
    rules:
      - if: "$CONFIG{MUSE_BOARD_ID} == \"sensecap_watcher\""
